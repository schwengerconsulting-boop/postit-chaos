name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postitchaos
          POSTGRES_PASSWORD: postitchaos-test
          POSTGRES_DB: postitchaos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postitchaos -d postitchaos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postitchaos:postitchaos-test@127.0.0.1:5432/postitchaos_ci
    steps:
      - uses: actions/checkout@v5

      - name: Pre-publish scan
        env:
          PREPUBLISH_PATTERN: ${{ secrets.PREPUBLISH_PATTERN }}
        run: bash scripts/prepublish-scan.sh

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit -- --no-file-parallelism
      - run: npm run test:integration -- --no-file-parallelism

      - name: Python client tests
        working-directory: client
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 -m unittest test_wb

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Start with docker compose (throwaway values)
        run: |
          HASH=$(printf %s "ci-throwaway-password" | docker run --rm -i -v "$PWD/scripts:/s:ro" node:24-slim node /s/hash-password.mjs)
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "WHITEBOARD_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "WHITEBOARD_ADMIN_PASSWORD_HASH=$HASH"
          } > .env
          docker compose up -d --build

      - name: Login page answers, board list is protected
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:1337/login >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:1337/login | grep -q "Post-it Chaos"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://localhost:1337/api/v1/boards)
          echo "unauthenticated API: $code"
          test "$code" != "200"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
